<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 교육용 뽀모도로 타이머</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="pomodoro-container">
        <!-- 헤더 및 모드 선택 탭 -->
        <header>
            <h1>🍅 톡톡 뽀모도로 타이머</h1>
            <p>공부와 휴식을 반복하며 집중력을 높여보세요!</p>
        </header>

        <div class="mode-buttons">
            <button id="mode-work" class="mode-btn active" onclick="setMode('work')">집중 공부 (25분)</button>
            <button id="mode-short" class="mode-btn" onclick="setMode('shortBreak')">짧은 휴식 (5분)</button>
            <button id="mode-long" class="mode-btn" onclick="setMode('longBreak')">긴 휴식 (15분)</button>
        </div>

        <!-- 타이머 원형 디스플레이 -->
        <div class="timer-display-box">
            <div class="time-left" id="time-display">25:00</div>
            <div class="timer-status" id="timer-status">공부할 시간이에요! 힘내세요 💪</div>
        </div>

        <!-- 컨트롤 버튼 -->
        <div class="control-buttons">
            <button id="start-btn" class="control-btn start" onclick="toggleTimer()">시작</button>
            <button id="reset-btn" class="control-btn reset" onclick="resetTimer()">초기화</button>
        </div>

        <!-- 완료 횟수 카운터 -->
        <div class="stats-box">
            <p>오늘 완료한 뽀모도로: <span id="completed-count">0</span>회</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
